<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c87a;
    --cream: #f5f0e8;
    --dark: #0e0e0e;
    --dark2: #1a1a1a;
    --dark3: #252525;
    --text: #d4cfc6;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px 60px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(201,168,76,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(201,168,76,0.05) 0%, transparent 60%);
  }

  .container { 
    width: 100%; 
    max-width: 420px; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
  }

  .header { 
    text-align: center; 
    margin-bottom: 24px; 
    animation: fadeDown 0.7s ease both; 
  }

  .avatar {
    width: 88px; height: 88px; border-radius: 50%; border: 2px solid var(--gold);
    background: var(--dark3); display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px; font-family: 'Playfair Display', serif; font-size: 32px;
    color: var(--gold); font-weight: 900; box-shadow: 0 0 32px rgba(201,168,76,0.2);
  }

  .name { 
    font-family: 'Playfair Display', serif; 
    font-size: 28px; 
    font-weight: 900; 
    color: var(--cream); 
    letter-spacing: 0.04em; 
    margin-bottom: 8px; 
  }

  .bio { 
    font-size: 14px; 
    font-weight: 300; 
    color: #9a9490; 
    line-height: 1.5; 
    max-width: 320px; 
    margin: 0 auto; 
  }

  /* Compact Hero Card */
  .hero-card {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    background: linear-gradient(135deg, rgba(201,168,76,0.12) 0%, rgba(26,26,26,0.9) 100%);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 14px 20px;
    text-align: center;
    transition: all 0.25s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    animation: fadeUp 0.6s ease both;
  }

  .hero-card:hover {
    transform: translateY(-2px);
    border-color: var(--gold-light);
    box-shadow: 0 8px 24px rgba(201,168,76,0.2);
  }

  .hero-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--dark);
    background: var(--gold);
    padding: 3px 8px;
    border-radius: 3px;
    margin-bottom: 6px;
  }

  .hero-subtitle {
    font-size: 13px;
    color: var(--cream);
    font-weight: 400;
    line-height: 1.4;
  }

  .divider { 
    width: 100%; 
    height: 1px; 
    background: linear-gradient(to right, transparent, var(--gold), transparent); 
    margin: 28px 0 22px; 
    opacity: 0.3; 
  }

  /* Social Area with Animated Gold Label */
  .social-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .social-label {
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--gold);
    display: inline-block;
    animation: goldGlow 3s ease-in-out infinite;
  }

  @keyframes goldGlow {
    0%, 100% {
      opacity: 0.75;
      text-shadow: 0 0 0 rgba(201, 168, 76, 0);
    }
    50% {
      opacity: 1;
      text-shadow: 0 0 10px rgba(201, 168, 76, 0.7), 0 0 20px rgba(232, 200, 122, 0.4);
    }
  }

  .social-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    width: 100%;
  }

  .social-icon-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--cream);
    text-decoration: none;
    transition: all 0.25s ease;
  }

  .social-icon-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    transition: transform 0.2s ease;
  }

  .social-icon-btn:hover {
    border-color: var(--gold);
    background: var(--dark3);
    color: var(--gold);
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }

  .social-icon-btn:hover svg {
    transform: scale(1.1);
  }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
